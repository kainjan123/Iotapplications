<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host Dashboard – IoT Mystery</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#18202b;--mu:#66707d;--ac:#1f6feb;--bd:#d8dee6;--ok:#1a7f37}
@media (prefers-color-scheme:dark){:root{--bg:#11151b;--card:#1a2029;--tx:#e8ecf1;--mu:#97a1ae;--ac:#58a6ff;--bd:#2d3542;--ok:#3fb950}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1150px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:14px}.ovx{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}
.bar{height:8px;background:var(--bd);border-radius:4px;min-width:80px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.pod{display:flex;gap:12px;align-items:flex-end;justify-content:center;margin:20px 0}.pod div{flex:1;max-width:260px;text-align:center;border-radius:14px 14px 0 0;padding:14px 8px;color:#fff;font-weight:700;font-size:20px}
.st{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}.done{background:var(--ok);color:#fff}
</style></head><body><main>
<div class="row" style="justify-content:space-between"><h1 style="margin:0">🎛 Host Dashboard — Live</h1><span class="mu" id="sync"></span></div>
<div class="card row" id="ctl" style="display:none"><span id="prog"></span><span style="flex:1"></span><button class="pri" id="rv">🏆 Reveal final results to students</button><button id="hd">Hide</button><button id="pv">Preview winners here</button><button id="rs">Reset all</button></div>
<div id="pod"></div>
<div class="card ovx"><table id="t"></table></div>
</main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pin=sessionStorage.getItem("hp")||"",preview=false,last=null;
async function api(p,b){const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"content-type":"application/json","x-host-pin":pin},body:b?JSON.stringify(b):undefined});const d=await r.json();if(!r.ok)throw d;return d}
const ST=["","Joined","Store done","Finished"];
function podium(rank){const c=["#d4a017","#8a94a0","#b0713a"],top=rank.slice(0,3),o=[1,0,2].filter(i=>top[i]);
 return `<div class="card"><h2 style="text-align:center;margin:0">🏆 Final Winners</h2><div class="pod">${o.map(i=>`<div style="background:${c[i]};padding-top:${i==0?60:i==1?40:24}px">${["🥇","🥈","🥉"][i]}<br>${esc(top[i].name)}<br><span style="font-size:32px">${top[i].total}</span>/100</div>`).join("")}</div></div>`}
async function tick(){try{const d=await api("board");last=d;$("ctl").style.display="flex";$("sync").textContent="live · "+new Date().toLocaleTimeString();
 const ts=d.teams,fin=ts.filter(t=>t.stage>=3);
 $("prog").textContent=`${ts.length} joined · ${fin.filter(Boolean).length} finished · results ${d.game.reveal?"REVEALED":"hidden"}`;
 const rank=[...fin].sort((a,b)=>b.total-a.total||a.spent-b.spent||a.at-b.at);
 $("pod").innerHTML=(d.game.reveal||preview)&&rank.length?podium(rank):"";
 const byN={};ts.forEach(t=>byN[t.n]=t);const rk={};rank.forEach((t,i)=>rk[t.n]=i+1);
 let h="<tr><th>#</th><th>Team</th><th>Status</th><th>Coins</th><th>Sensors /40</th><th>Cost /10</th><th>Rule /15</th><th>Attack /35</th><th>Total /100</th><th>Rank</th></tr>";
 for(let n=1;n<=12;n++){const t=byN[n];if(!t){h+=`<tr><td>${n}</td><td class="mu">— not joined —</td><td colspan="8"></td></tr>`;continue}
  const m=t.m||{};h+=`<tr><td>${n}</td><td><b>${esc(t.name)}</b><div class="mu">${esc(t.attackTitle||"")}</div></td><td><span class="st ${t.stage>=3?"done":""}">${ST[t.stage]}</span></td><td>${t.spent||0}</td><td>${m.sens??"–"}</td><td>${m.cost??"–"}</td><td>${m.rule??"–"}</td><td>${m.attack??"–"}</td><td><b>${t.total}</b><div class="bar"><i style="width:${t.total}%"></i></div></td><td>${rk[n]||"–"}</td></tr>`}
 $("t").innerHTML=h}catch(e){if(e.error=="bad pin"){pin=prompt("Host PIN")||"";sessionStorage.setItem("hp",pin)}else $("sync").textContent="connection issue…"}}
$("rv").onclick=async()=>{await api("host",{action:"reveal"});tick()};$("hd").onclick=async()=>{await api("host",{action:"hide"});preview=false;tick()};
$("pv").onclick=()=>{preview=!preview;tick()};
$("rs").onclick=async()=>{if(confirm("Delete ALL teams and scores?")){await api("host",{action:"reset"});tick()}};
tick();setInterval(tick,3000);
</script></body></html>
